<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Loading...</title>
</head>
<body>
<script>
window.addEventListener("load", function() {
    // List of banned users
    const bannedUsers = [
        "banneduser1@example.com",
        "spammer@test.com",
        "blockme@domain.net",
    ];

    // Retrieve stored email and ban status
    const storedEmail = localStorage.getItem("userEmail");
    const isBannedFlag = localStorage.getItem("isBanned");

    // Function to check if email is in the banned list
    function isEmailBanned(email) {
        return bannedUsers.includes(email.toLowerCase());
    }

    // First, verify if the current email is in the banned list
    if (storedEmail && isEmailBanned(storedEmail)) {
        // User is banned
        localStorage.setItem("isBanned", "true");
        window.location.href = "https://google.com";
        return;
    } else {
        // Email not in banned list, remove ban flag if it exists
        if (isBannedFlag === "true") {
            localStorage.removeItem("isBanned");
        }
    }

    // If user was previously banned, redirect
    if (isBannedFlag === "true") {
        window.location.href = "https://google.com";
        return;
    }

    // Check if first visit
    const hasVisited = localStorage.getItem("hasVisited");
    if (!hasVisited) {
        // First visit: prompt for email
        const emailInput = prompt("Please enter your email to access this page. (Do NOT fabricate this)");
        if (!emailInput) {
            // Cancel or blank: ban the user
            localStorage.setItem("isBanned", "true");
            window.location.href = "https://google.com";
            return;
        } else {
            // Save email
            localStorage.setItem("userEmail", emailInput.toLowerCase().trim());
            localStorage.setItem("hasVisited", "true");
        }
    }

    // After first visit, check if the stored email is now banned
    const currentEmail = localStorage.getItem("userEmail");
    if (currentEmail && isEmailBanned(currentEmail)) {
        // Email is banned; set flag and redirect
        localStorage.setItem("isBanned", "true");
        window.location.href = "https://google.com";
        return;
    }

    // Load your iframe content
    const iframe = document.createElement('iframe');
    iframe.style.position = 'fixed';
    iframe.style.top = '0';
    iframe.style.left = '0';
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = 'none';

    iframe.src = "https://idkeman.github.io/website-load/";

    document.body.innerHTML = '';
    document.body.appendChild(iframe);

    const fallbackUrl = "https://wordleunlimited.gg/?";
    const loadTimeout = setTimeout(function() {
        window.location.href = fallbackUrl;
    }, 3000);

    iframe.onload = function() {
        clearTimeout(loadTimeout);
        console.log("iframe loaded successfully");
    };

    iframe.onerror = function() {
        clearTimeout(loadTimeout);
        window.location.href = fallbackUrl;
    };
});
</script>
</body>
</html>
