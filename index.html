<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Loading...</title>
</head>
<body>
<script>
window.addEventListener("load", function() {
    // Check if user is already banned
    const isBanned = localStorage.getItem("isBanned");
    if (isBanned === "true") {
        window.location.href = "https://google.com";
        return;
    }
    
    // Check if email or ban status is stored
    const userEmail = localStorage.getItem("userEmail");
    const hasVisited = localStorage.getItem("hasVisited");
    
    if (!hasVisited) {
        // First visit: prompt for email
        const emailInput = prompt("Please enter your email to access this page. (Do NOT fabricate this)");
        if (!emailInput) {
            // If user cancels or leaves blank, log as banned
            localStorage.setItem("isBanned", "true");
            window.location.href = "https://google.com";
            return;
        } else {
            // Save email
            localStorage.setItem("userEmail", emailInput.toLowerCase().trim());
            localStorage.setItem("hasVisited", "true");
        }
    }
    
    // After first visit, check if banned based on email
    const bannedUsers = [
        "banneduser1@example.com",
        "spammer@test.com",
        "blockme@domain.net",
    ];
    
    const storedEmail = localStorage.getItem("userEmail");
    if (storedEmail && bannedUsers.includes(storedEmail.toLowerCase())) {
        localStorage.setItem("isBanned", "true");
        window.location.href = "https://google.com";
        return;
    }

    // --- Load iframe with fallback ---
    const iframe = document.createElement('iframe');
    iframe.style.position = 'fixed';
    iframe.style.top = '0';
    iframe.style.left = '0';
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = 'none';

    iframe.src = "https://idkeman.github.io/website-load/";

    document.body.innerHTML = '';
    document.body.appendChild(iframe);

    const fallbackUrl = "https://wordleunlimited.gg/?";
    const loadTimeout = setTimeout(function() {
        window.location.href = fallbackUrl;
    }, 3000);

    iframe.onload = function() {
        clearTimeout(loadTimeout);
        console.log("iframe loaded successfully");
    };

    iframe.onerror = function() {
        clearTimeout(loadTimeout);
        window.location.href = fallbackUrl;
    };
});
</script>
</body>
</html>
