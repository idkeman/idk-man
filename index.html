<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loading…</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; frame-src https://idkeman.github.io https://docs.google.com;"/>
</head>
<body>
<script>
(function () {
  'use strict';

  // Configuration
  const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSciQMmNPv9GdgKbhvl8NN42NQ00AFVxUdGToZhGH9-s9Wa-GA/viewform?usp=publish-editor';
  const IFRAME_SRC = 'https://idkeman.github.io/website-load/';
  const FALLBACK_URL = 'https://wordleunlimited.gg/';
  const IFRAME_LOAD_TIMEOUT = 8000; // ms

  // Deployed Vercel function URL
  const CHECK_API_URL = 'https://idk-man-eight.vercel.app/api/check-email';

  // Storage helpers
  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { console.warn('localStorage unavailable', e); return null; }
  }
  function safeSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { console.warn('localStorage unavailable', e); }
  }
  function safeRemove(key) {
    try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
  }

  // First-visit redirect to form
  (function firstVisitRedirect() {
    try {
      const hasVisited = safeGet('hasVisited');
      if (!hasVisited) {
        safeSet('hasVisited', 'first');
        location.replace(FORM_URL);
      }
    } catch (e) {
      console.warn('firstVisitRedirect error', e);
    }
  })();

  async function checkEmailOnServer(email) {
    try {
      const resp = await fetch(CHECK_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (!resp.ok) {
        console.warn('Server returned', resp.status);
        return { allowed: false, reason: 'server_error' };
      }
      return await resp.json();
    } catch (err) {
      console.error('Network error checking email', err);
      return { allowed: false, reason: 'network_error' };
    }
  }

  window.addEventListener('DOMContentLoaded', async function () {
    // Early banned flag
    const isBannedFlag = safeGet('isBanned');
    if (isBannedFlag === 'true') {
      location.replace(FALLBACK_URL);
      return;
    }

    // If first visit -> second visit flow
    const visitStatus = safeGet('hasVisited');
    if (visitStatus === 'first') {
      safeSet('hasVisited', 'second');

      let email = null;
      try {
        email = prompt('Enter the school email you used in the doc (or Cancel to exit):');
      } catch (e) {
        console.warn('prompt unavailable', e);
      }

      if (email === null || email.trim() === '') {
        safeSet('isBanned', 'true');
        location.replace(FALLBACK_URL);
        return;
      }

      email = email.trim();

      // Basic client-side sanity check before sending to server
      const emailRegex = /^[A-Za-z][A-Za-z0-9._+-]*@smyrnaeagles\.org$/i;
      if (!emailRegex.test(email)) {
        alert('Access restricted to smyrnaeagles.org addresses.');
        safeSet('isBanned', 'true');
        location.replace(FALLBACK_URL);
        return;
      }

      // Check with server
      const result = await checkEmailOnServer(email);
      if (!result || result.allowed !== true) {
        safeSet('isBanned', 'true');
        // Optionally you can inspect result.reason for logging or UX
        location.replace(FALLBACK_URL);
        return;
      }

      // Allowed: store a short-lived marker (sessionStorage) and proceed
      try { sessionStorage.setItem('userEmail', email); } catch (e) { safeSet('userEmail', email); }
    }

    // Load iframe content
    const iframe = document.createElement('iframe');
    iframe.title = 'Embedded content';
    iframe.loading = 'eager';
    iframe.sandbox = 'allow-forms allow-scripts allow-popups allow-same-origin';
    iframe.style.position = 'fixed';
    iframe.style.top = '0';
    iframe.style.left = '0';
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = 'none';
    iframe.src = IFRAME_SRC;

    document.body.replaceChildren(iframe);

    const loadTimeout = setTimeout(function () {
      console.warn('Iframe load timeout — redirecting to fallback');
      location.replace(FALLBACK_URL);
    }, IFRAME_LOAD_TIMEOUT);

    iframe.addEventListener('load', function () { clearTimeout(loadTimeout); console.log('iframe loaded'); });
    iframe.addEventListener('error', function () { clearTimeout(loadTimeout); location.replace(FALLBACK_URL); });
  });
})();
</script>
</body>
</html>
