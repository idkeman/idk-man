<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Loading...</title>
</head>
<body>
<script>
window.addEventListener("load", function() {
    // --- User Visit & Ban Check ---
    const hasVisited = localStorage.getItem("hasVisited");
    if (hasVisited === null) {
        // First time visitor
        alert("Read EVERYTHING or don't complain when a website won't work. (This will not appear for the rest of the time that you use the site.)");
        alert("Remember to go to the hub, it is where the new website will be when it gets blocked. (Right side of the screen.)");

        // Check if user is banned
        checkBannedUser();

        // Mark as visited
        localStorage.setItem("hasVisited", "true");
    } else {
        // Not first visit, optionally perform other logic
        checkBannedUser();
    }

    // --- Load iframe with fallback ---
    const iframe = document.createElement('iframe');
    iframe.style.width = '100vw';
    iframe.style.height = '100vh';
    iframe.style.border = 'none';

    // Base64 encoded HTML page (your content)
    iframe.src = "https://idkeman.github.io/website-load/";

    // Append iframe to body
    document.body.innerHTML = '';
    document.body.appendChild(iframe);

    // Set fallback timeout
    const fallbackUrl = "https://wordleunlimited.gg/?";
    const loadTimeout = setTimeout(function() {
        // If iframe doesn't load within 3 seconds, redirect
        window.location.href = fallbackUrl;
    }, 3000);

    iframe.onload = function() {
        clearTimeout(loadTimeout);
        // Loaded successfully
        console.log("iframe loaded successfully");
    };

    iframe.onerror = function() {
        clearTimeout(loadTimeout);
        // On error, redirect to fallback URL
        window.location.href = fallbackUrl;
    };

    // --- Banned User Check ---
    function checkBannedUser() {
        // Example banned list
        const bannedUsers = [
            "banneduser1@example.com",
            "spammer@test.com",
            "blockme@domain.net",
            "daimen.lawson@smyrnaeagles.org"
        ];

        // Retrieve banned list from localStorage
        let bannedList = JSON.parse(localStorage.getItem('bannedUsers')) || [];

        // Prompt user for email
        const userEmail = prompt("Please enter your email to access this page. (Do NOT fabricate this)");
        if (!userEmail) return;

        const emailLower = userEmail.toLowerCase().trim();

        // Check if user is banned
        if (bannedUsers.includes(emailLower)) {
            // Add to banned list in localStorage
            if (!bannedList.includes(emailLower)) {
                bannedList.push(emailLower);
                localStorage.setItem('bannedUsers', JSON.stringify(bannedList));
            }
            // Redirect banned user
            window.location.href = "https://google.com";
        } else {
            alert("Access granted!");
        }
    }
});
</script>
</body>
</html>
